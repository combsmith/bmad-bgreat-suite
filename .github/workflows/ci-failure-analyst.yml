# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: combsmith/.github-private/templates/ci-failure-analyst.yml
# Standard:        combsmith/.github-private/docs/aw/ci-failure-analyst.md
# Reusable:        combsmith/.github-private/.github/workflows/ci-failure-analyst-reusable.yml
#
# AGENTS — READ BEFORE EDITING:
#   • This file is a THIN CALLER STUB. All analysis logic lives in the reusable
#     workflow above (failing-step identification, root-cause classification,
#     and PR comment posting).
#   • Keep this file in sync with the source-of-truth template above. The only
#     intended local differences are this header and the channel pin in the
#     `uses:` line (this repo is a ring1 member in the canary registry).
#   • The reusable reads `github.event.check_run.*`, so the trigger must stay
#     `check_run` — a `workflow_run` trigger leaves that payload null and the
#     reusable fails.
#   • If you need different behaviour, open a PR against the reusable in the
#     central repo.
# ─────────────────────────────────────────────────────────────────────────────
#
# CI Failure Analyst — thin caller for the org-level reusable.
# Posts a read-only diagnostic comment on PRs shortly after a CI check failure.
# Required org/repo secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  org secret — must be granted to this repo in org
#                            secret settings (Settings -> Secrets -> Actions)
#
# This workflow is independent of dev-lead. Both can coexist in the same repo:
#   dev-lead             — diagnoses and attempts to fix CI failures (writes commits)
#   ci-failure-analyst   — diagnoses only, always posts a fast diagnostic comment
#
# Docs: https://github.com/combsmith/.github-private/blob/main/docs/aw/ci-failure-analyst.md
# ─────────────────────────────────────────────────────────────────────────────

name: "CI Failure Analyst"

on:
  check_run:
    types: [completed]

permissions: {}

concurrency:
  group: "ci-failure-analyst-${{ github.event.check_run.head_sha }}"
  cancel-in-progress: false

jobs:
  analyze:
    permissions:
      pull-requests: write
      issues: write        # post/read PR comments via the Issues comments API
      actions: read
      contents: read
      checks: read
    # Skip non-failures and the analyst's own check run to prevent loops.
    if: >-
      github.event.check_run.conclusion == 'failure' &&
      !startsWith(github.event.check_run.name, 'CI Failure Analyst')
    uses: combsmith/.github-private/.github/workflows/ci-failure-analyst-reusable.yml@ci-failure-analyst/v1-ring1  # NOSONAR(githubactions:S7637) first-party channel ref
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
